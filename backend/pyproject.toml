[project]
name = "ai-ppt-studio-backend"
version = "0.1.0"
description = "Local AI service for AI PPT Studio"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
